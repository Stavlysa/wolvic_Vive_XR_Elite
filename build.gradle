// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    dependencies {
        classpath libs.agp
        classpath libs.kotlin.plugin
        classpath libs.huawei.agconnect.agcp

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

allprojects {
    repositories {
        google()
        maven { url 'https://maven.mozilla.org/maven2' }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://storage.googleapis.com/r8-releases/raw' }
        // The Wave SDK is license-gated and intentionally kept outside the
        // source tree. The user-provided 5.6.0 archive is extracted beside
        // the Wolvic checkout and exposed as a local Maven repository.
        maven { url uri("${rootDir}/../vive-wave-sdk-5.6.0/repo") }
    }
}

tasks.register("clean", Delete) {
    delete layout.buildDirectory
}
